<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's Progress 📊</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#060e06; --green:#52b788; --lime:#7bed9f; --amber:#ffc107;
    --fire:#ff6b35; --bone:#e8d5b0; --red:#f72585; --sky:#90e0ef;
    --purple:#c77dff; --card:rgba(255,255,255,0.05); --border:rgba(255,255,255,0.1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;z-index:0;
    background:radial-gradient(ellipse at 15% 20%,rgba(199,125,255,.12) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 80%,rgba(82,183,136,.10) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,#060e06 0%,#020802 100%);}

  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:24px 16px 70px;}

  .hdr{text-align:center;margin-bottom:22px;}
  .hdr-badge{display:inline-block;background:rgba(199,125,255,.1);border:1.5px solid rgba(199,125,255,.3);border-radius:50px;padding:5px 16px;font-size:.78rem;font-weight:800;color:var(--purple);letter-spacing:.5px;margin-bottom:8px;}
  .hdr h1{font-family:'Boogaloo',cursive;font-size:clamp(1.9rem,6vw,3rem);color:var(--amber);text-shadow:2px 2px 0 #5a3800,0 0 30px rgba(255,193,7,.2);}
  .hdr p{color:rgba(255,255,255,.4);font-weight:700;font-size:.88rem;margin-top:5px;}
  .back-link{display:inline-block;margin-bottom:16px;color:rgba(255,255,255,.45);font-weight:800;font-size:.85rem;text-decoration:none;}
  .back-link:hover{color:var(--amber);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .stat-box{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:16px;text-align:center;}
  .stat-box .sv{font-family:'Boogaloo',cursive;font-size:1.9rem;color:var(--amber);display:block;}
  .stat-box .sl{font-size:.7rem;color:rgba(255,255,255,.4);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

  .section-title{font-family:'Boogaloo',cursive;font-size:1.3rem;color:var(--amber);margin:24px 0 12px;text-shadow:1px 1px 0 #5a3800;}

  .app-card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:10px;}
  .app-card .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .app-card .an{font-family:'Boogaloo',cursive;font-size:1.1rem;color:white;}
  .app-card .ab{font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:50px;background:rgba(123,237,159,.12);border:1.5px solid rgba(123,237,159,.35);color:var(--lime);}
  .app-card .arow{display:flex;gap:16px;font-size:.78rem;color:rgba(255,255,255,.55);font-weight:700;flex-wrap:wrap;}
  .app-card .arow b{color:rgba(255,255,255,.85);}
  .bar-wrap{height:8px;background:rgba(255,255,255,.08);border-radius:6px;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--lime),var(--amber));}

  .history-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;margin-bottom:7px;font-size:.8rem;}
  .history-row .he{font-size:1.3rem;flex-shrink:0;}
  .history-row .hmain{flex:1;color:rgba(255,255,255,.8);font-weight:700;}
  .history-row .hmain b{color:white;}
  .history-row .hdate{color:rgba(255,255,255,.35);font-weight:700;font-size:.72rem;flex-shrink:0;}
  .history-row .hpct{font-family:'Boogaloo',cursive;font-size:1rem;flex-shrink:0;min-width:44px;text-align:right;}

  .empty{text-align:center;padding:50px 20px;color:rgba(255,255,255,.4);font-weight:700;line-height:1.7;}
  .empty .eemoji{font-size:3rem;display:block;margin-bottom:14px;}

  .reset-btn{display:block;margin:30px auto 0;padding:11px 26px;border:2px solid rgba(247,37,133,.4);background:rgba(247,37,133,.08);color:#ffaacc;border-radius:50px;font-family:'Boogaloo',cursive;font-size:.95rem;cursor:pointer;transition:all .2s;}
  .reset-btn:hover{background:rgba(247,37,133,.15);}
  .note{text-align:center;font-size:.75rem;color:rgba(255,255,255,.3);font-weight:700;margin-top:10px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">⬅️ Back to Learning Hub</a>
  <div class="hdr">
    <div class="hdr-badge">📊 DAVID'S PROGRESS</div>
    <h1>How Am I Doing? 🌟</h1>
    <p>Every quiz you finish gets saved here automatically!</p>
  </div>

  <div id="content"></div>

  <button class="reset-btn" id="resetBtn" onclick="resetStats()" style="display:none;">🗑️ Reset All Stats</button>
  <p class="note">Stats are saved in this browser only — they won't appear on a different phone or computer.</p>
</div>
<script>
const KEY='david-stats-v1';
function loadStats(){
  try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; }
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function pctColor(p){
  if(p>=0.8) return '#7bed9f';
  if(p>=0.6) return '#ffc107';
  if(p>=0.4) return '#ff6b35';
  return '#f72585';
}

function render(){
  const stats=loadStats();
  const content=document.getElementById('content');
  if(stats.length===0){
    content.innerHTML=`<div class="empty"><span class="eemoji">🌱</span>No sessions played yet!<br>Finish a quiz in any app and it\'ll show up here.</div>`;
    document.getElementById('resetBtn').style.display='none';
    return;
  }
  document.getElementById('resetBtn').style.display='block';

  const totalSessions=stats.length;
  const avgPct=stats.reduce((a,s)=>a+s.pct,0)/totalSessions;
  const bestPct=Math.max(...stats.map(s=>s.pct));
  const byApp={};
  stats.forEach(s=>{
    if(!byApp[s.app]) byApp[s.app]={label:s.appLabel,count:0,totalPct:0,best:0,last:s.date};
    const a=byApp[s.app];
    a.count++; a.totalPct+=s.pct; if(s.pct>a.best)a.best=s.pct;
    if(new Date(s.date)>new Date(a.last)) a.last=s.date;
  });

  let html='';
  html+=`<div class="stat-grid">
    <div class="stat-box"><span class="sv">${totalSessions}</span><span class="sl">Sessions Played</span></div>
    <div class="stat-box"><span class="sv">${Math.round(avgPct*100)}%</span><span class="sl">Average Score</span></div>
    <div class="stat-box"><span class="sv">${Math.round(bestPct*100)}%</span><span class="sl">Best Score</span></div>
    <div class="stat-box"><span class="sv">${Object.keys(byApp).length}</span><span class="sl">Subjects Tried</span></div>
  </div>`;

  html+=`<div class="section-title">📚 By Subject</div>`;
  Object.keys(byApp).sort((a,b)=>byApp[b].count-byApp[a].count).forEach(k=>{
    const a=byApp[k];
    const avg=a.totalPct/a.count;
    html+=`<div class="app-card">
      <div class="ah"><span class="an">${a.label}</span><span class="ab">${a.count} play${a.count>1?'s':''}</span></div>
      <div class="arow"><span>Avg: <b>${Math.round(avg*100)}%</b></span><span>Best: <b>${Math.round(a.best*100)}%</b></span><span>Last played: <b>${fmtDate(a.last)}</b></span></div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(avg*100)}%"></div></div>
    </div>`;
  });

  html+=`<div class="section-title">🕐 Recent Sessions</div>`;
  const recent=stats.slice().reverse().slice(0,15);
  recent.forEach(s=>{
    const pct=Math.round(s.pct*100);
    let extraNote='';
    if(s.extra && s.extra.mode) extraNote=` · ${s.extra.mode}`;
    if(s.extra && s.extra.peakLevelLabel) extraNote+=` · reached ${s.extra.peakLevelLabel}`;
    html+=`<div class="history-row">
      <span class="he">${pct>=80?'🏆':pct>=60?'⭐':pct>=40?'🎯':'🌱'}</span>
      <span class="hmain"><b>${s.appLabel}</b>${extraNote} — ${s.score}/${s.maxScore} pts</span>
      <span class="hdate">${fmtDate(s.date)}</span>
      <span class="hpct" style="color:${pctColor(s.pct)}">${pct}%</span>
    </div>`;
  });

  content.innerHTML=html;
}

function resetStats(){
  if(confirm('Are you sure you want to delete ALL saved progress? This cannot be undone.')){
    localStorage.removeItem(KEY);
    render();
  }
}

render();
</script>
</body>
</html>
